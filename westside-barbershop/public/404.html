<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — WestSide Barbershop</title>
  <link rel="icon" href="/pagina-web/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0a0a0a; --paper: #fafafa; --line: #2a2a2a; }
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }
    .code {
      font-family: "Anton", "Archivo Black", sans-serif;
      font-size: clamp(5rem, 26vw, 12rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    h1 {
      font-family: "Anton", sans-serif;
      font-size: clamp(1.4rem, 6vw, 2.4rem);
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin-top: 1rem;
    }
    p { color: rgba(250, 250, 250, 0.65); margin-top: 0.75rem; max-width: 34rem; }
    .actions { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 3rem; padding: 0 1.75rem; border-radius: 9999px;
      font-size: 0.875rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.03em; text-decoration: none; transition: transform 0.2s ease;
    }
    .btn:hover { transform: scale(1.03); }
    .btn-primary { background: var(--paper); color: var(--ink); }
    .btn-outline { border: 1px solid rgba(250, 250, 250, 0.4); color: var(--paper); }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; border-radius: 2px; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esta página se fue a cortarse el pelo</h1>
    <p>El enlace que buscas no existe o cambió de sitio. Vuelve a la portada y sigue desde ahí.</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://agenciatechia6-byte.github.io/pagina-web/">Volver al inicio</a>
      <a class="btn btn-outline" href="https://wa.me/34641985591?text=Hola!%20Quiero%20reservar%20cita%20en%20WestSide%20%F0%9F%92%88" target="_blank" rel="noopener">Reservar por WhatsApp</a>
    </div>
  </main>
</body>
</html>
